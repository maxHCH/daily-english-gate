<!DOCTYPE html>
<html lang="">
<head>
  <meta charset="utf-8">
  <title>Daily English Gate — Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div id="app">
    <h1>Daily English Gate</h1>
    <h2 data-i18n="settingsTitle"></h2>

    <section>
      <label class="section-label" data-i18n="settingsDuration"></label>
      <div class="input-row">
        <input type="number" id="duration-input" min="1" max="60" value="10">
        <span data-i18n="settingsDurationUnit"></span>
      </div>
    </section>

    <section>
      <label class="section-label" for="reminder-time" data-i18n="settingsReminder"></label>
      <input type="time" id="reminder-time" value="20:00">
    </section>

    <div id="saved-msg" class="hidden" data-i18n="settingsSaved"></div>
  </div>
  <script src="settings.js"></script>
</body>
</html>
