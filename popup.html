<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <title>Daily English Gate</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <h1>Daily English Gate</h1>

    <div id="timer-section">
      <svg class="timer-ring" viewBox="0 0 120 120">
        <circle class="ring-bg" cx="60" cy="60" r="52"/>
        <circle id="ring-fg" class="ring-fg" cx="60" cy="60" r="52"/>
      </svg>
      <div id="time-display">--:--</div>
    </div>
    <div id="target-label">/ 10:00 目標</div>

    <div id="status-text">載入中...</div>

    <div id="stats">
      <div class="stat">
        <div class="stat-value" id="streak-val">—</div>
        <div class="stat-label">連續天數</div>
      </div>
      <div class="stat-sep"></div>
      <div class="stat">
        <div class="stat-value" id="weekly-val">—</div>
        <div class="stat-label">本週完成</div>
      </div>
    </div>

    <button id="start-btn" class="hidden">立即開始</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
